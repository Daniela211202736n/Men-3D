name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # Las pruebas de integracion tocan la base de verdad: liquidacion de
      # pagos, idempotencia, borrado de un restaurante.
      # El bus del KDS con varias instancias. La prueba levanta dos buses y
      # comprueba que un pedido publicado en uno llega al otro: con un doble no
      # se probaria nada.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: men3d
          POSTGRES_PASSWORD: men3d_ci
          POSTGRES_DB: men3d_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U men3d -d men3d_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://men3d:men3d_ci@localhost:5432/men3d_test?schema=public
      # El end-to-end levanta la API; sin un secreto valido se niega a arrancar.
      JWT_SECRET: clave-de-integracion-continua-con-largo-suficiente
      REDIS_URL: redis://localhost:6379
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci


      - name: Instalar Chromium
        # Antes de los modelos y no junto al end-to-end: `models:sample` tambien
        # renderiza la imagen de cada plato abriendo el modelo en el navegador.
        run: npx playwright install --with-deps chromium

      - name: Generar los modelos 3D de ejemplo y sus imagenes
        run: npm run models:sample

      - name: Compilar el paquete compartido
        # La API y la PWA tipan contra sus declaraciones: tiene que ir primero.
        run: npm run build -w @men3d/shared

      - name: Generar el cliente de Prisma
        # `migrate deploy` no genera el cliente: sin este paso
        # `@prisma/client` no exporta ningun modelo y el chequeo de tipos se
        # cae entero. No necesita la base, solo el esquema.
        run: npm run db:generate

      - name: Aplicar migraciones
        run: npm run db:deploy

      - name: Catalogo de planes
        # Los planes son datos de referencia, no de demo: sin ellos un
        # restaurante no tiene suscripcion y le quedan los pedidos
        # deshabilitados. Las pruebas de abono, setup fee, correo de
        # confirmacion y aislamiento los necesitan, y corren antes del sembrado
        # de demo.
        run: npm run db:plans

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilación de producción
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high


      - name: Datos de demostración
        # El recorrido del comensal necesita una carta cargada.
        run: npm run db:seed

      - name: End-to-end del comensal
        # Escanear → ver en 3D → pedir → pagar. La compilación de producción ya
        # corrió arriba, así que `vite preview` sirve ese mismo build.
        run: npm run e2e

      - name: Guardar el informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Que las imagenes compilen es parte del contrato: un Dockerfile roto no se
  # descubre al desplegar.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir la imagen de la PWA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
