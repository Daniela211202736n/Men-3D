# nginx para la PWA.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los GLB pueden pesar unos MB; sin esto nginx los rechaza al subir por el
    # proxy hacia la API.
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Politica de seguridad de contenido.
    #
    # Medida contra la aplicacion real, no copiada de ningun lado: se cargo la
    # carta, el visor 3D y la ficha del local con esta cabecera puesta,
    # escuchando `securitypolicyviolation`, hasta que no quedo ninguna. Lo que
    # justifica cada directiva poco obvia:
    #
    #   wasm-unsafe-eval  <model-viewer> compila WebAssembly para decodificar
    #                     la malla. Sin esto el modelo igual se ve —cae a un
    #                     decodificador en JavaScript— pero cada apertura de un
    #                     plato deja una violacion en la consola y el decodeo
    #                     es mas lento. Comprobado: al quitarlo aparece
    #                     `script-src <- wasm-eval`.
    #   blob:             los workers de decodificacion y las texturas.
    #   unsafe-inline     en `style-src` unicamente: React escribe los estilos
    #                     como atributo `style`. No habilita scripts en linea.
    #   openstreetmap     el mapa del local es un iframe suyo.
    #
    # Si se agrega una fuente externa (una tipografia, un pixel de analitica),
    # hay que medirlo de nuevo: el sintoma de no hacerlo es un recurso que no
    # carga sin ningun error visible al usuario.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: blob: data:; worker-src 'self' blob:; media-src 'self' blob: data:; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # La API vive detras del mismo origen: asi la PWA no necesita CORS ni saber
    # en que dominio esta el backend.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El stream del KDS es Server-Sent Events: sin esto nginx lo acumula en
        # un buffer y la pantalla de cocina no recibe nada hasta que se corta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /upload { proxy_pass http://api:4000/upload; client_max_body_size 30m; }

    # Medios subidos desde el backoffice (driver `local`). Deliberadamente NO es
    # /assets/: ese es el directorio de los bundles de Vite, y proxearlo manda
    # el JavaScript de la PWA a la API.
    location /media/ { proxy_pass http://api:4000; }

    # Bundles de la PWA: llevan hash en el nombre, no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repetidas a proposito: en nginx, un bloque que define sus propios
        # `add_header` DESCARTA los heredados. Sin esto, este contenido se
        # serviria sin ninguna de las cabeceras de seguridad de arriba.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~* \.(?:glb|usdz)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Repetidas a proposito: en nginx, un bloque que define sus propios
        # `add_header` DESCARTA los heredados. Sin esto, este contenido se
        # serviria sin ninguna de las cabeceras de seguridad de arriba.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        types { model/gltf-binary glb; model/vnd.usdz+zip usdz; }
        default_type model/gltf-binary;
    }

    # El service worker nunca se cachea: si se cachea, la PWA queda clavada en
    # una version vieja y no hay forma de actualizarla.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Repetidas a proposito: en nginx, un bloque que define sus propios
        # `add_header` DESCARTA los heredados. Sin esto, este contenido se
        # serviria sin ninguna de las cabeceras de seguridad de arriba.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Aplicacion de una sola pagina: cualquier ruta desconocida la resuelve el
    # enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
