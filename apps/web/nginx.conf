# nginx para la PWA.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los GLB pueden pesar unos MB; sin esto nginx los rechaza al subir por el
    # proxy hacia la API.
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml model/gltf-binary;

    # Cabeceras de seguridad basicas. No se define CSP aca: <model-viewer>
    # necesita WebAssembly y workers, y una politica mal ajustada rompe el
    # visor 3D en silencio. Ver docs/DEPLOY.md.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # La API vive detras del mismo origen: asi la PWA no necesita CORS ni saber
    # en que dominio esta el backend.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El stream del KDS es Server-Sent Events: sin esto nginx lo acumula en
        # un buffer y la pantalla de cocina no recibe nada hasta que se corta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /upload { proxy_pass http://api:4000/upload; client_max_body_size 30m; }

    # Medios subidos desde el backoffice (driver `local`). Deliberadamente NO es
    # /assets/: ese es el directorio de los bundles de Vite, y proxearlo manda
    # el JavaScript de la PWA a la API.
    location /media/ { proxy_pass http://api:4000; }

    # Bundles de la PWA: llevan hash en el nombre, no cambian nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:glb|usdz)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { model/gltf-binary glb; model/vnd.usdz+zip usdz; }
        default_type model/gltf-binary;
    }

    # El service worker nunca se cachea: si se cachea, la PWA queda clavada en
    # una version vieja y no hay forma de actualizarla.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Aplicacion de una sola pagina: cualquier ruta desconocida la resuelve el
    # enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
